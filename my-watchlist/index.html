<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- fonts preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Fonts  -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&family=Manrope:wght@200..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <title>Watchlist</title>
    <link rel="shortcut icon" href="src/assets/movie-favicon.png" type="image/x-icon">
    <link rel="stylesheet" href="src/style.css">
</head>
<body>
    <header class="header-stack">
        <div class="user-box">
            <svg class="user-icon" width="32px" height="32px" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><g id="SVGRepo_bgCarrier" stroke-width="0"></g><g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g><g id="SVGRepo_iconCarrier"> <path opacity="0.5" d="M22 12C22 17.5228 17.5228 22 12 22C6.47715 22 2 17.5228 2 12C2 6.47715 6.47715 2 12 2C17.5228 2 22 6.47715 22 12Z" fill="currentColor"></path> <path d="M16.807 19.0112C15.4398 19.9504 13.7841 20.5 12 20.5C10.2159 20.5 8.56023 19.9503 7.193 19.0111C6.58915 18.5963 6.33109 17.8062 6.68219 17.1632C7.41001 15.8302 8.90973 15 12 15C15.0903 15 16.59 15.8303 17.3178 17.1632C17.6689 17.8062 17.4108 18.5964 16.807 19.0112Z" fill="hsl(33, 36%, 11%)"></path> <path d="M12 12C13.6569 12 15 10.6569 15 9C15 7.34315 13.6569 6 12 6C10.3432 6 9.00004 7.34315 9.00004 9C9.00004 10.6569 10.3432 12 12 12Z" fill="hsl(33, 36%, 11%)"></path> </g>
            </svg>
            <span
            role="status"
            id="welcome-msg"
            >
            Bem-vindo, #

            </span>
        </div>
        <h1>Minha Watchlist</h1>
        <nav class="login-nav">
            <ul role="list">
                <li>
                    <button class="login-- btn">
                        Crie uma conta
                        <svg class="login-icon" width="18px" height="18px" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><g id="SVGRepo_bgCarrier" stroke-width="0"></g><g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g><g id="SVGRepo_iconCarrier"> <path d="M11.0005 15.9995L15.0005 11.9995M15.0005 11.9995L11.0005 7.99951M15.0005 11.9995H3.00049M11.0005 2.99951H17.7997C18.9198 2.99951 19.4799 2.99951 19.9077 3.2175C20.284 3.40925 20.59 3.71521 20.7817 4.09153C20.9997 4.51935 20.9997 5.07941 20.9997 6.19951V17.7995C20.9997 18.9196 20.9997 19.4797 20.7817 19.9075C20.59 20.2838 20.284 20.5898 19.9077 20.7815C19.4799 20.9995 18.9198 20.9995 17.7997 20.9995H11.0005" stroke="var(--color-surface)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path> </g></svg>
                    </button>
                    

                </li>
            </ul>
        </nav>

    </header>

    <main>
        <section class="section-stack">
            <img src="src/assets/interestelar-gargantua.jpg" alt="">
        </section>
    </main>


    
    <dialog open="on" class="modal-dialog">
        
        <form method="dialog" id="login-frm">
            <input 
            type="email"
            name="email"
            id="inEmail"
            placeholder=" "
            required
            autocomplete="off"
            >
            <label for="inEmail"
            id="email-label">
                insira seu email
            </label>

            <input type="password"
            name="senha"
            id="inSenha"
            placeholder=" "
            required
            autocomplete="off"
            >
        </form>
    </dialog>
    
    




    <script type="module" src="src/main.js"></script>
</body>
</html>
